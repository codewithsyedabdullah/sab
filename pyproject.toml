[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sab-agent"
version = "0.1.0"
description = "Open-source coding agent that works locally"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Syed Abdullah Yaqoob" }]
dependencies = [
    "typer>=0.12.0",
    "litellm>=1.40.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
sab = "sab.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["sab"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
